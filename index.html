<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Rotina da Manhã</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&family=Nunito:wght@600;800&display=swap" rel="stylesheet">
<style>
  :root{
    --sky:#4EA8DE;
    --sun:#FFC145;
    --coral:#FF6B6B;
    --mint:#5FC28E;
    --navy:#1D3557;
    --cream:#FFF7E9;
    --card:#FFFFFF;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  html,body{
    width:100%; height:100%;
    background: var(--cream);
    font-family:'Nunito', sans-serif;
    color:var(--navy);
    overflow:hidden;
  }
  body{
    display:flex;
    flex-direction:column;
    height:100vh;
    padding:2vh 3vw;
  }

  /* ---- Top bar ---- */
  header{
    display:flex;
    justify-content:center;
    align-items:baseline;
    margin-bottom:1.5vh;
  }
  header h1{
    font-family:'Baloo 2', sans-serif;
    font-weight:800;
    font-size:2.8vw;
    color:var(--navy);
  }

  /* ---- Botões de utilidade (testar / resetar horário) ---- */
  #util-buttons{
    position:fixed;
    top:1.5vh;
    left:1.5vw;
    z-index:500;
    display:flex;
    gap:0.8vw;
  }
  .util-btn{
    font-family:'Nunito', sans-serif;
    font-weight:700;
    font-size:0.95vw;
    border:none;
    border-radius:999px;
    padding:0.9vh 1.2vw;
    cursor:pointer;
    color:white;
    opacity:0.85;
    -webkit-tap-highlight-color: transparent;
  }
  .util-btn:focus{
    outline:4px solid var(--sun);
    outline-offset:2px;
  }
  #test-schedule-btn{ background:var(--sky); }
  #reset-schedule-btn{ background:#9aa5b1; }

  /* ---- Rodapé: relógio atual + horário limite (ao lado do botão de som) ---- */
  #bottom-info{
    position:fixed;
    bottom:2.5vh;
    right:9.5vw;
    z-index:500;
    display:flex;
    align-items:center;
    gap:1.2vw;
  }
  #clock{
    font-family:'Baloo 2', sans-serif;
    font-weight:700;
    font-size:1.8vw;
    color:var(--sky);
    background:rgba(255,255,255,0.85);
    border-radius:16px;
    padding:0.8vh 1vw;
  }
  #limit-control{
    display:flex;
    align-items:center;
    gap:0.6vw;
    background:rgba(255,255,255,0.85);
    border-radius:16px;
    padding:0.8vh 1vw;
  }
  #limit-control .limit-title{
    font-family:'Nunito', sans-serif;
    font-weight:700;
    font-size:0.9vw;
    color:var(--navy);
    margin-right:0.3vw;
  }
  .limit-unit{
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:0.2vh;
  }
  .limit-value{
    font-family:'Baloo 2', sans-serif;
    font-weight:800;
    font-size:1.3vw;
    color:var(--navy);
    min-width:2.2vw;
    text-align:center;
  }
  .limit-colon{
    font-family:'Baloo 2', sans-serif;
    font-weight:800;
    font-size:1.3vw;
    color:var(--navy);
    align-self:center;
  }
  .limit-btn{
    width:1.8vw;
    height:1.8vw;
    min-width:20px;
    min-height:20px;
    border-radius:6px;
    border:none;
    background:rgba(29,53,87,0.1);
    color:var(--navy);
    font-weight:800;
    font-size:0.9vw;
    cursor:pointer;
    -webkit-tap-highlight-color: transparent;
  }
  .limit-btn:focus{
    outline:4px solid var(--sun);
    outline-offset:2px;
  }

  /* ---- Main layout ---- */
  main{
    flex:1;
    display:grid;
    grid-template-columns: 1.4fr 1fr;
    gap:3vw;
    min-height:0;
  }

  /* ---- Current task hero ---- */
  #hero{
    background:var(--card);
    border-radius:32px;
    padding:2.5vh 2.5vw;
    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;
    text-align:center;
    box-shadow:0 12px 0 rgba(29,53,87,0.08);
    position:relative;
    transition: background 0.6s ease;
    overflow-y:auto;
    scrollbar-width:none;
  }
  #hero::-webkit-scrollbar{ display:none; }
  #hero.done{ background:var(--mint); color:white; }
  #hero-emoji{
    font-size:7.5vw;
    line-height:1;
    margin-bottom:1vh;
  }
  #hero-label{
    font-family:'Baloo 2', sans-serif;
    font-weight:800;
    font-size:3.4vw;
    margin-bottom:1vh;
  }
  #hero-sub{
    font-size:1.4vw;
    opacity:0.75;
    margin-bottom:1.5vh;
  }

  #minutes-left{
    font-family:'Baloo 2', sans-serif;
    font-weight:800;
    font-size:5vw;
    color:var(--coral);
    line-height:1;
  }
  #hero.done #minutes-left{ color:white; }
  #minutes-left .unit{
    font-size:1.4vw;
    font-weight:700;
    margin-left:0.5vw;
  }
  #segments{
    display:flex;
    gap:0.5vw;
    justify-content:center;
    flex-wrap:wrap;
    margin-top:1.2vh;
    max-width:100%;
  }
  .seg{
    width:3vw;
    height:3vw;
    min-width:26px;
    min-height:26px;
    border-radius:9px;
    background:rgba(29,53,87,0.12);
    display:flex;
    align-items:center;
    justify-content:center;
    font-family:'Baloo 2', sans-serif;
    font-weight:700;
    font-size:1.1vw;
    color:var(--navy);
    position:relative;
    overflow:hidden;
    flex-shrink:0;
  }
  .seg .fill{
    position:absolute;
    left:0; top:0; bottom:0;
    width:0%;
    background:var(--sun);
    transition:width 0.3s linear;
  }
  .seg span{ position:relative; z-index:1; }
  .seg.complete{ background:var(--mint); color:white; }
  .seg.complete .fill{ display:none; }
  .seg.overtime{ background:rgba(255,107,107,0.18); }
  .seg.overtime .fill{ background:var(--coral); }
  .seg.overtime.complete{ background:var(--coral); color:white; }
  #hero.done .seg{ background:rgba(255,255,255,0.3); color:white; }

  #finish-early-btn{
    margin-top:1.8vh;
    font-family:'Baloo 2', sans-serif;
    font-weight:800;
    font-size:1.5vw;
    background:var(--mint);
    color:white;
    border:none;
    border-radius:18px;
    padding:1.4vh 2.2vw;
    cursor:pointer;
    box-shadow:0 6px 0 rgba(29,53,87,0.15);
    -webkit-tap-highlight-color: transparent;
    flex-shrink:0;
  }
  #finish-early-btn:focus{
    outline:5px solid var(--sun);
    outline-offset:2px;
  }
  #hero.done #finish-early-btn{ display:none; }
  #start-next-btn{
    display:none;
    margin-top:1.8vh;
    font-family:'Baloo 2', sans-serif;
    font-weight:800;
    font-size:1.6vw;
    background:var(--sky);
    color:white;
    border:none;
    border-radius:18px;
    padding:1.6vh 2.6vw;
    cursor:pointer;
    box-shadow:0 6px 0 rgba(29,53,87,0.15);
    -webkit-tap-highlight-color: transparent;
    flex-shrink:0;
  }
  #start-next-btn:focus{
    outline:5px solid var(--sun);
    outline-offset:2px;
  }

  /* ---- Timeline ---- */
  #timeline{
    display:flex;
    flex-direction:column;
    gap:1vh;
    overflow-y:auto;
    scrollbar-width:none;
  }
  #timeline::-webkit-scrollbar{ display:none; }
  .step{
    background:var(--card);
    border-radius:18px;
    padding:1.1vh 1.4vw;
    display:flex;
    align-items:center;
    gap:1vw;
    opacity:0.55;
    transform:scale(0.97);
    transition: all 0.4s ease;
    border-left:8px solid transparent;
    flex-shrink:0;
  }
  .step .emoji{ font-size:2.6vw; }
  .step .info{ flex:1; min-width:0; }
  .step .name{
    font-family:'Baloo 2', sans-serif;
    font-weight:700;
    font-size:1.5vw;
  }
  .step .time{
    font-size:1.05vw;
    color:#6b7a90;
  }
  .step.active{
    opacity:1;
    transform:scale(1.03);
    border-left-color:var(--coral);
    box-shadow:0 6px 0 rgba(29,53,87,0.08);
  }
  .step.finished{
    opacity:0.9;
    border-left-color:var(--mint);
  }
  .step.finished .name{ text-decoration: line-through; text-decoration-color:var(--mint); }
  .check{
    font-size:1.8vw;
    color:var(--mint);
    flex-shrink:0;
  }
  .outcome-badge{
    font-size:1.8vw;
    flex-shrink:0;
  }
  .outcome-badge.star{
    font-size:3vw;
    filter: drop-shadow(0 0 6px rgba(255,193,69,0.7));
    animation: star-pop 0.5s ease;
  }
  @keyframes star-pop{
    0%{ transform:scale(0); }
    60%{ transform:scale(1.3); }
    100%{ transform:scale(1); }
  }

  /* ---- Celebração / incentivo ---- */
  #celebration-layer{
    position:fixed;
    inset:0;
    pointer-events:none;
    z-index:700;
    overflow:hidden;
  }
  .confetti-piece{
    position:absolute;
    top:45%;
    animation: confetti-rise 1.7s ease-out forwards;
  }
  @keyframes confetti-rise{
    0%{ transform:translateY(0) scale(0.5) rotate(0deg); opacity:0; }
    15%{ opacity:1; }
    100%{ transform:translateY(-32vh) scale(1.3) rotate(25deg); opacity:0; }
  }
  .balloon{
    position:absolute;
    bottom:-12vh;
    width:4.5vw;
    height:5.5vw;
    min-width:36px;
    min-height:44px;
    border-radius:50% 50% 50% 50% / 58% 58% 42% 42%;
    animation: balloon-rise 3.6s ease-in forwards;
  }
  .balloon::after{
    content:'';
    position:absolute;
    left:50%;
    bottom:-2.5vh;
    width:1px;
    height:2.5vh;
    background:rgba(29,53,87,0.35);
  }
  @keyframes balloon-rise{
    0%{ transform:translateY(0) translateX(0); opacity:0; }
    10%{ opacity:1; }
    100%{ transform:translateY(-125vh) translateX(var(--drift, 10px)); opacity:0; }
  }
  #encourage-banner{
    position:fixed;
    top:12vh;
    left:50%;
    transform:translateX(-50%) translateY(-20px);
    background:var(--sky);
    color:white;
    font-family:'Baloo 2', sans-serif;
    font-weight:800;
    font-size:1.8vw;
    padding:2vh 3vw;
    border-radius:20px;
    box-shadow:0 8px 0 rgba(29,53,87,0.2);
    z-index:750;
    opacity:0;
    transition: opacity 0.4s ease, transform 0.4s ease;
    pointer-events:none;
  }
  #encourage-banner.show{
    opacity:1;
    transform:translateX(-50%) translateY(0);
  }

  /* ---- Setas de reordenar (só em tarefas ainda não feitas) ---- */
  .reorder-controls{
    display:flex;
    flex-direction:column;
    gap:0.4vh;
    flex-shrink:0;
  }
  .reorder-btn{
    width:2.4vw;
    height:2.4vw;
    min-width:24px;
    min-height:24px;
    border-radius:8px;
    border:none;
    background:rgba(29,53,87,0.08);
    color:var(--navy);
    font-size:1.2vw;
    display:flex;
    align-items:center;
    justify-content:center;
    cursor:pointer;
    -webkit-tap-highlight-color: transparent;
  }
  .reorder-btn:disabled{ opacity:0.25; cursor:default; }
  .reorder-btn:focus{
    outline:4px solid var(--sun);
    outline-offset:1px;
  }

  /* ---- Botão liga/desliga som ---- */
  #sound-toggle{
    position:fixed;
    bottom:2.5vh;
    right:2.5vw;
    z-index:500;
    width:6vw;
    height:6vw;
    min-width:56px;
    min-height:56px;
    border-radius:50%;
    border:none;
    background:var(--mint);
    color:white;
    font-size:2.6vw;
    display:flex;
    align-items:center;
    justify-content:center;
    cursor:pointer;
    box-shadow:0 6px 0 rgba(29,53,87,0.15);
    -webkit-tap-highlight-color: transparent;
  }
  #sound-toggle.off{ background:#9aa5b1; }
  #sound-toggle:focus{
    outline:5px solid var(--sun);
    outline-offset:2px;
  }

  /* ---- Diálogo de confirmação de tarefa ---- */
  #confirm-overlay{
    position:fixed;
    inset:0;
    background:rgba(29,53,87,0.85);
    display:none;
    align-items:center;
    justify-content:center;
    z-index:800;
  }
  .confirm-card{
    background:white;
    border-radius:28px;
    padding:4vh 4vw;
    max-width:60vw;
    text-align:center;
  }
  .confirm-card.urgent{
    animation: urgent-pulse 0.5s ease infinite;
    box-shadow: 0 0 0 6px rgba(255,107,107,0.5);
  }
  @keyframes urgent-pulse{
    0%,100%{ transform:scale(1); }
    50%{ transform:scale(1.03); }
  }
  .confirm-title{
    font-family:'Baloo 2', sans-serif;
    font-weight:800;
    font-size:2.6vw;
    margin-bottom:3vh;
    color:var(--navy);
  }
  .confirm-buttons{
    display:flex;
    gap:2vw;
    justify-content:center;
    margin-bottom:2.5vh;
  }
  .confirm-btn{
    font-family:'Baloo 2', sans-serif;
    font-weight:800;
    font-size:1.8vw;
    border:none;
    border-radius:18px;
    padding:2vh 2.5vw;
    cursor:pointer;
    color:white;
    box-shadow:0 6px 0 rgba(29,53,87,0.15);
  }
  .confirm-btn.yes{ background:var(--mint); font-size:2.1vw; }
  .confirm-btn.no{ background:var(--coral); }
  .confirm-btn:focus{
    outline:5px solid var(--sun);
    outline-offset:2px;
  }
  .confirm-timer-wrap{
    width:100%;
    height:1.6vh;
    background:rgba(29,53,87,0.1);
    border-radius:999px;
    overflow:hidden;
    margin-bottom:1.5vh;
  }
  #confirm-timer-bar{
    height:100%;
    width:100%;
    background:var(--sky);
    transition:width 1s linear;
  }
  .confirm-hint{
    font-size:1.2vw;
    color:#6b7a90;
  }

  /* ---- Tela de configuração ---- */
  #settings-overlay{
    position:fixed;
    inset:0;
    background:rgba(29,53,87,0.9);
    display:none;
    align-items:center;
    justify-content:center;
    z-index:900;
    padding:3vh 2vw;
  }
  .settings-card{
    background:var(--cream);
    border-radius:24px;
    padding:3vh 3vw;
    width:100%;
    max-width:900px;
    max-height:92vh;
    overflow-y:auto;
    scrollbar-width:thin;
  }
  .settings-card h2{
    font-family:'Baloo 2', sans-serif;
    font-weight:800;
    font-size:1.8vw;
    color:var(--navy);
    margin-bottom:2vh;
  }
  .settings-label{
    display:block;
    font-family:'Nunito', sans-serif;
    font-weight:700;
    font-size:1vw;
    color:var(--navy);
    margin-bottom:0.6vh;
  }
  .settings-text-input, .settings-time-input, .settings-select{
    font-family:'Nunito', sans-serif;
    font-size:1vw;
    padding:1vh 1vw;
    border-radius:10px;
    border:2px solid rgba(29,53,87,0.15);
    background:white;
    color:var(--navy);
  }
  #settings-child-name{
    width:100%;
    max-width:320px;
    margin-bottom:1.5vh;
  }
  #step-size-row{
    display:flex;
    align-items:center;
    gap:0.6vw;
    margin-bottom:1vh;
    flex-wrap:wrap;
  }
  #step-size-row .settings-label{ display:inline; margin:0; }
  .step-size-btn{
    font-family:'Baloo 2', sans-serif;
    font-weight:700;
    font-size:0.95vw;
    border:2px solid rgba(29,53,87,0.15);
    background:white;
    color:var(--navy);
    border-radius:10px;
    padding:0.6vh 1vw;
    cursor:pointer;
  }
  .step-size-btn.selected{ background:var(--sky); color:white; border-color:var(--sky); }
  #autolink-row{
    display:flex;
    align-items:center;
    gap:0.5vw;
    margin-bottom:2vh;
    font-family:'Nunito', sans-serif;
    font-size:0.95vw;
    color:var(--navy);
  }
  #autolink-row input{ width:1.4vw; height:1.4vw; min-width:16px; min-height:16px; }
  .task-row{
    background:white;
    border-radius:16px;
    padding:1.5vh 1.2vw;
    margin-bottom:1.2vh;
    display:flex;
    flex-wrap:wrap;
    align-items:center;
    gap:0.8vw;
  }
  .task-row .emoji-preview{
    font-size:2vw;
    width:2.6vw;
    height:2.6vw;
    min-width:32px;
    min-height:32px;
    display:flex;
    align-items:center;
    justify-content:center;
    background:rgba(29,53,87,0.06);
    border-radius:10px;
    flex-shrink:0;
  }
  .task-name-input{ flex:1; min-width:140px; }
  .emoji-picker{
    display:flex;
    flex-wrap:wrap;
    gap:0.3vw;
    width:100%;
    margin:0.6vh 0 0.4vh 0;
  }
  .emoji-picker button{
    font-size:1.4vw;
    padding:0.4vh 0.5vw;
    border-radius:8px;
    border:2px solid transparent;
    background:rgba(29,53,87,0.06);
    cursor:pointer;
  }
  .emoji-picker button.selected{ border-color:var(--sky); background:rgba(78,168,222,0.2); }
  .task-time-group{ display:flex; align-items:center; gap:0.6vw; font-size:0.9vw; color:var(--navy); }
  .time-stepper{ display:flex; flex-direction:column; align-items:center; gap:0.1vh; }
  .time-stepper .time-value{
    font-family:'Baloo 2', sans-serif;
    font-weight:800;
    font-size:1.1vw;
    color:var(--navy);
    min-width:3.2vw;
    text-align:center;
  }
  .time-step-btn{
    width:1.8vw;
    height:1.6vw;
    min-width:22px;
    min-height:20px;
    border-radius:6px;
    border:none;
    background:rgba(29,53,87,0.1);
    color:var(--navy);
    font-weight:800;
    font-size:0.9vw;
    cursor:pointer;
  }
  .task-row .sound-url-input{ width:100%; margin-top:0.5vh; }
  .task-row .remove-task-btn{
    background:var(--coral);
    color:white;
    border:none;
    border-radius:8px;
    width:2.2vw;
    height:2.2vw;
    min-width:26px;
    min-height:26px;
    cursor:pointer;
    flex-shrink:0;
  }
  .task-row .row-reorder{ display:flex; flex-direction:column; gap:0.2vh; }
  .task-row .row-reorder button{
    width:1.8vw; height:1.6vw; min-width:20px; min-height:18px;
    border-radius:5px; border:none; background:rgba(29,53,87,0.08); cursor:pointer; font-size:0.8vw;
  }
  .task-row .row-reorder button:disabled{ opacity:0.25; }
  .settings-add-btn{
    font-family:'Baloo 2', sans-serif;
    font-weight:700;
    font-size:1.1vw;
    background:var(--sky);
    color:white;
    border:none;
    border-radius:14px;
    padding:1.2vh 2vw;
    cursor:pointer;
    margin-top:0.5vh;
  }
  .settings-actions{
    display:flex;
    justify-content:flex-end;
    gap:1vw;
    margin-top:3vh;
  }
  .settings-btn{
    font-family:'Baloo 2', sans-serif;
    font-weight:800;
    font-size:1.2vw;
    border:none;
    border-radius:16px;
    padding:1.4vh 2.4vw;
    cursor:pointer;
    color:white;
  }
  .settings-btn.cancel{ background:#9aa5b1; }
  .settings-btn.save{ background:var(--mint); }

  /* ---- Telas estreitas (celular, principalmente na vertical) ----
     Evita que o relógio + horário limite colidam com o botão de som:
     nesses casos, esse grupo sobe pro canto superior direito, deixando
     o rodapé só com o botão de som. */
  @media (max-width: 700px), (orientation: portrait){
    #bottom-info{
      top:7vh;
      bottom:auto;
      right:1.5vw;
      left:auto;
      flex-direction:column;
      align-items:flex-end;
      gap:0.8vh;
    }
    #clock{
      font-size:3.2vw;
      padding:0.6vh 2vw;
    }
    #limit-control{
      padding:0.6vh 2vw;
    }
    #limit-control .limit-title{ font-size:2.6vw; }
    .limit-value, .limit-colon{ font-size:3vw; }
    .limit-btn{ width:4vw; height:4vw; min-width:22px; min-height:22px; font-size:2.2vw; }
    header{ padding-top:1vh; }
    header h1{ font-size:4.2vw; }
  }
</style>
</head>

<script>
// ---------- CONFIGURAÇÃO PADRÃO (usada só se não houver nada salvo neste navegador) ----------
const DEFAULT_TASKS = [
  { name: "Acordar",              emoji: "🛏️", start: [7,55],  end:[8,5],  sound: { type: "melody" } },
  { name: "Tomar café da manhã",  emoji: "🥣", start: [8,5],  end:[8,20] },
  { name: "Trocar de roupa",      emoji: "👕", start: [8,20], end:[8,30] },
  { name: "Escovar os dentes",    emoji: "🪥", start: [8,30], end:[8,40] },
  { name: "Calçar sapatos e ir para a Kita", emoji: "👟", start:[8,40], end:[8,45] },
];
const DEFAULT_CHILD_NAME = "Gabriel";

// ---------- Presets pra tela de configuração ----------
const EMOJI_PRESETS = ["🛏️","🥣","👕","🪥","👟","🛁","🧸","💇","🎒","🌙","📚","🧴","🥛","🍎","🧦","🚽","🧹","🖍️"];

// ---------- Persistência (localStorage do navegador desta TV) ----------
const STORAGE_KEY = 'rotinaConfig_v1';
function loadStoredConfig(){
  try{
    const raw = localStorage.getItem(STORAGE_KEY);
    if(!raw) return null;
    const parsed = JSON.parse(raw);
    if(!parsed || !Array.isArray(parsed.tasks) || parsed.tasks.length === 0) return null;
    return parsed;
  }catch(e){ return null; }
}
function saveStoredConfig(childName, taskList){
  try{
    localStorage.setItem(STORAGE_KEY, JSON.stringify({ childName, tasks: taskList }));
    return true;
  }catch(e){ return false; }
}

const stored = loadStoredConfig();
let TASKS = stored ? stored.tasks : DEFAULT_TASKS;
let CHILD_NAME = stored ? (stored.childName || "") : DEFAULT_CHILD_NAME;

function toMinutes([h,m]){ return h*60+m; }

// Cada tarefa guarda sua própria duração (baseDurationMin) e um contador
// cosmético de minutos "vermelhos" (redMin) quando é estendida. As tarefas
// são sempre encadeadas sem intervalo: a próxima começa quando a anterior
// termina, seja na hora certa, adiantada (checkbox) ou atrasada (diálogo).
let tasks = [];
let PLANNED = [];
let dayStartMin = 0;
let TARGET_END_MIN = 0;
let limitMin = 0;
let pointer = 0; // índice da tarefa atual; pointer === tasks.length = rotina completa

function buildTasksFromConfig(cfg){
  return cfg.map(t => ({
    name: t.name,
    emoji: t.emoji,
    sound: t.sound,
    baseDurationMin: toMinutes(t.end) - toMinutes(t.start),
    redMin: 0,
    outcome: null,
    startMin: 0,
    endMin: 0
  }));
}

function hardLimitMin(){ return limitMin; }

function recomputeUpcoming(overrideCursor){
  let cursor = (overrideCursor !== undefined) ? overrideCursor : (pointer > 0 ? tasks[pointer-1].endMin : dayStartMin);
  for(let i = pointer; i < tasks.length; i++){
    tasks[i].startMin = cursor;
    tasks[i].endMin = cursor + tasks[i].baseDurationMin;
    cursor = tasks[i].endMin;
  }
}

// (Re)constrói toda a rotina a partir de uma configuração — usado no carregamento
// inicial e sempre que a pessoa salva novas configurações na tela de "Configurar".
function nowInMinutes(){
  const d = new Date();
  return d.getHours()*60 + d.getMinutes() + d.getSeconds()/60;
}

// Se a página for aberta (ou a rotina recarregada) depois do horário de
// alguma tarefa já ter passado, avança em silêncio até a tarefa atual de
// verdade — sem diálogo de confirmação nem som, um por um, retroativamente.
function catchUpToNow(){
  const nowMin = nowInMinutes();
  while(pointer < tasks.length && nowMin >= tasks[pointer].endMin){
    tasks[pointer].outcome = 'skipped';
    pointer++;
    recomputeUpcoming();
  }
}

function initSchedule(cfg){
  tasks = buildTasksFromConfig(cfg);
  PLANNED = cfg.map(t => ({ baseDurationMin: toMinutes(t.end) - toMinutes(t.start) }));
  dayStartMin = toMinutes(cfg[0].start);
  TARGET_END_MIN = toMinutes(cfg[cfg.length-1].end);
  limitMin = TARGET_END_MIN + 10;
  pointer = 0;
  awaitingStart = false;
  lastSegTaskIndex = -1;
  closeConfirm();
  recomputeUpcoming();
  catchUpToNow();
  rebuildTimelineDOM();
  updateHeaderTitle();
}

function fmt([h,m]){
  return String(h).padStart(2,'0') + ':' + String(m).padStart(2,'0');
}
function fmtMin(min){
  return fmt([Math.floor(min/60), Math.round(min%60)]);
}

const heroEl = document.getElementById('hero');
const heroEmoji = document.getElementById('hero-emoji');
const heroLabel = document.getElementById('hero-label');
const heroSub = document.getElementById('hero-sub');
const minutesLeftEl = document.getElementById('minutes-left');
const segmentsEl = document.getElementById('segments');
const finishEarlyBtn = document.getElementById('finish-early-btn');
const timelineEl = document.getElementById('timeline');
const clockEl = document.getElementById('clock');
const pageTitleEl = document.getElementById('page-title');

function updateHeaderTitle(){
  pageTitleEl.textContent = CHILD_NAME ? `🌞 Rotina de ${CHILD_NAME}` : '🌞 Rotina da Manhã';
}

// ---------- Construção da timeline (refeita sempre que a ordem muda) ----------
function rebuildTimelineDOM(){
  timelineEl.innerHTML = '';
  tasks.forEach((t, i) => {
    const div = document.createElement('div');
    div.className = 'step';
    div.id = 'step-' + i;
    const isDone = i < pointer;
    const canMoveUp = !isDone && i > pointer;
    const canMoveDown = !isDone && i < tasks.length - 1;
    div.innerHTML = `
      <div class="emoji">${t.emoji}</div>
      <div class="info">
        <div class="name">${t.name}</div>
        <div class="time">${fmtMin(t.startMin)} – ${fmtMin(t.endMin)}${t.redMin ? ` (+${t.redMin}min)` : ''}</div>
      </div>
      ${isDone
        ? `<div class="check">✔</div>${t.outcome === 'skipped' ? '' : `<div class="outcome-badge${t.outcome === 'late' ? '' : ' star'}">${t.outcome === 'late' ? '🐢' : '⭐'}</div>`}`
        : `<div class="reorder-controls">
             <button class="reorder-btn up" data-index="${i}" ${canMoveUp ? '' : 'disabled'} title="Mover mais cedo">▲</button>
             <button class="reorder-btn down" data-index="${i}" ${canMoveDown ? '' : 'disabled'} title="Mover mais tarde">▼</button>
           </div>`
      }
    `;
    timelineEl.appendChild(div);
  });
}
// (a construção inicial da timeline acontece no initSchedule() lá no fim do arquivo)

// ---------- SOM (beep gerado, sem arquivos externos) ----------
let soundEnabled = false; // começa desligado; usuário liga com o botão
let audioCtx;

function ensureAudioCtx(){
  if(!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  if(audioCtx.state === 'suspended') audioCtx.resume();
  return audioCtx;
}

function beep(freq=880, duration=0.15, delay=0){
  if(!soundEnabled) return;
  try{
    const ctx = ensureAudioCtx();
    const t0 = ctx.currentTime + delay;
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.type = 'sine';
    osc.frequency.value = freq;
    gain.gain.setValueAtTime(0.0001, t0);
    gain.gain.exponentialRampToValueAtTime(0.25, t0+0.02);
    gain.gain.exponentialRampToValueAtTime(0.0001, t0+duration);
    osc.connect(gain).connect(ctx.destination);
    osc.start(t0);
    osc.stop(t0+duration+0.05);
  }catch(e){}
}
function chime(){ beep(660,0.15,0); beep(880,0.18,0.16); beep(1046,0.22,0.34); }

// Melodia de demonstração pra tarefa "Acordar" (só pra testar "som maior no
// início" enquanto não temos um mp3 real hospedado — troque por sound.src
// com um link/arquivo de música quando tiver um).
function wakeMelody(){
  const notes = [523,587,659,698,784,880,784,659];
  notes.forEach((f,i) => beep(f, 0.22, i*0.2));
}

// ---------- Som de palmas (ruído filtrado, em ritmo de aplauso) ----------
// ---------- Som de aplauso "torcida" (camada de ruído + palmas espalhadas) ----------
function playClapSound(){
  if(!soundEnabled) return;
  try{
    const ctx = ensureAudioCtx();
    const duration = 2.6;
    const t0 = ctx.currentTime;

    // camada 1: "rugido" contínuo de fundo, tipo torcida ao longe
    const roarBuf = ctx.createBuffer(1, Math.floor(ctx.sampleRate*duration), ctx.sampleRate);
    const roarData = roarBuf.getChannelData(0);
    for(let i=0;i<roarData.length;i++){ roarData[i] = Math.random()*2-1; }
    const roarSrc = ctx.createBufferSource();
    roarSrc.buffer = roarBuf;
    const roarFilter = ctx.createBiquadFilter();
    roarFilter.type = 'bandpass';
    roarFilter.frequency.value = 1600;
    roarFilter.Q.value = 0.5;
    const roarGain = ctx.createGain();
    roarGain.gain.setValueAtTime(0.0001, t0);
    roarGain.gain.linearRampToValueAtTime(0.16, t0+0.3);
    roarGain.gain.linearRampToValueAtTime(0.12, t0+duration-0.5);
    roarGain.gain.linearRampToValueAtTime(0.0001, t0+duration);
    roarSrc.connect(roarFilter).connect(roarGain).connect(ctx.destination);
    roarSrc.start(t0);

    // camada 2: muitas palminhas individuais, espalhadas e irregulares (não em ritmo fixo)
    const clapCount = 45;
    for(let i=0;i<clapCount;i++){
      const t = Math.random() * duration * 0.92;
      const dur = 0.05 + Math.random()*0.05;
      const bufferSize = Math.floor(ctx.sampleRate * dur);
      const buffer = ctx.createBuffer(1, bufferSize, ctx.sampleRate);
      const data = buffer.getChannelData(0);
      for(let j=0;j<bufferSize;j++){ data[j] = (Math.random()*2-1) * Math.pow(1-j/bufferSize, 2); }
      const noise = ctx.createBufferSource();
      noise.buffer = buffer;
      const filter = ctx.createBiquadFilter();
      filter.type = 'bandpass';
      filter.frequency.value = 1200 + Math.random()*2500;
      filter.Q.value = 0.8 + Math.random();
      const gain = ctx.createGain();
      gain.gain.value = 0.10 + Math.random()*0.16;
      noise.connect(filter).connect(gain).connect(ctx.destination);
      noise.start(t0 + t);
    }

    // camada 3: assobios (glissando agudo)
    [0.15, 1.3].forEach(delay => {
      const t1 = t0 + delay;
      const osc = ctx.createOscillator();
      osc.type = 'sine';
      const g = ctx.createGain();
      osc.frequency.setValueAtTime(1100, t1);
      osc.frequency.exponentialRampToValueAtTime(2500, t1+0.18);
      osc.frequency.exponentialRampToValueAtTime(1700, t1+0.42);
      g.gain.setValueAtTime(0.0001, t1);
      g.gain.linearRampToValueAtTime(0.16, t1+0.05);
      g.gain.linearRampToValueAtTime(0.0001, t1+0.48);
      osc.connect(g).connect(ctx.destination);
      osc.start(t1); osc.stop(t1+0.5);
    });

    // camada 4: "gritos" de torcida (ruído filtrado com glissando)
    [0.05, 0.85, 1.9].forEach(delay => {
      const t1 = t0 + delay;
      const dur = 0.55;
      const bufferSize = Math.floor(ctx.sampleRate*dur);
      const buf = ctx.createBuffer(1, bufferSize, ctx.sampleRate);
      const d = buf.getChannelData(0);
      for(let i=0;i<bufferSize;i++){ d[i] = Math.random()*2-1; }
      const src = ctx.createBufferSource();
      src.buffer = buf;
      const filt = ctx.createBiquadFilter();
      filt.type = 'bandpass';
      filt.Q.value = 6;
      filt.frequency.setValueAtTime(450, t1);
      filt.frequency.exponentialRampToValueAtTime(1300, t1+dur*0.6);
      const g = ctx.createGain();
      g.gain.setValueAtTime(0.0001, t1);
      g.gain.linearRampToValueAtTime(0.22, t1+0.12);
      g.gain.linearRampToValueAtTime(0.0001, t1+dur);
      src.connect(filt).connect(g).connect(ctx.destination);
      src.start(t1);
    });
  }catch(e){}
}

// ---------- Balões coloridos subindo (genéricos, sem personagens de marca) ----------
function spawnBalloons(){
  const colors = ['#FF6B6B','#FFC145','#5FC28E','#4EA8DE','#B983FF','#FF8FB1'];
  for(let i=0;i<7;i++){
    const b = document.createElement('div');

    b.style.left = (5 + Math.random()*88) + '%';

}

// ---------- Fala (aviso encorajador, com timbre mais "mascote") ----------
function speak(text, opts={}){
  if(!soundEnabled) return;
  try{
    if('speechSynthesis' in window){
      const u = new SpeechSynthesisUtterance(text);
      u.lang = 'pt-BR';
      u.pitch = opts.pitch !== undefined ? opts.pitch : 1;
      u.rate = opts.rate !== undefined ? opts.rate : 1;
      const voices = window.speechSynthesis.getVoices();
      const ptVoice = voices.find(v => v.lang && v.lang.toLowerCase().startsWith('pt'));
      if(ptVoice) u.voice = ptVoice;
      window.speechSynthesis.speak(u);
    } else {
      beep(392,0.2,0); beep(440,0.2,0.22); beep(494,0.3,0.44); // motivo suave, sem voz
    }
  }catch(e){}
}

const taskAudio = new Audio();
taskAudio.loop = false;

function stopTaskAudio(){
  if(!taskAudio.paused){
    taskAudio.pause();
    taskAudio.currentTime = 0;
  }
}

function playForTask(task){
  if(!soundEnabled){
    stopTaskAudio();
    return;
  }
  if(task && task.sound && task.sound.type === 'melody'){
    stopTaskAudio();
    wakeMelody();
  } else if(task && task.sound && task.sound.src){
    stopTaskAudio();
    taskAudio.src = task.sound.src;
    taskAudio.loop = !!task.sound.loop;
    taskAudio.volume = (task.sound.volume !== undefined) ? task.sound.volume : 1;
    taskAudio.currentTime = 0;
    taskAudio.play().catch(()=>{ wakeMelody(); });
  } else {
    stopTaskAudio();
    chime();
  }
}

// ---------- Segmentos por minuto ----------
let lastSegTaskIndex = -1;

function buildSegments(totalMin, redMin=0){
  segmentsEl.innerHTML = '';
  const n = Math.max(1, Math.round(totalMin));
  const redCount = Math.round(redMin);
  for(let i=0;i<n;i++){
    const seg = document.createElement('div');
    const isRed = i >= (n - redCount);
    seg.className = 'seg' + (isRed ? ' overtime' : '');
    seg.innerHTML = `<div class="fill"></div><span>${i+1}</span>`;
    segmentsEl.appendChild(seg);
  }
}
function updateSegments(elapsedMin){
  const segs = segmentsEl.children;
  for(let i=0;i<segs.length;i++){
    const seg = segs[i];
    const fill = seg.querySelector('.fill');
    const segElapsed = Math.min(1, Math.max(0, elapsedMin - i));
    if(segElapsed >= 1){
      seg.classList.add('complete');
      fill.style.width = '100%';
    } else {
      seg.classList.remove('complete');
      fill.style.width = (segElapsed*100) + '%';
    }
  }
}

// ---------- Extensão de tarefa (+5 min), respeitando o horário limite ----------
// Recalcula só as tarefas DEPOIS da atual (pointer), usando o fim atual dela
// como âncora. Nunca mexe no início da própria tarefa atual — importante
// porque esse início pode ter sido definido por um "Iniciar" adiantado.
function cascadeAfterPointer(){
  let cursor = tasks[pointer].endMin;
  for(let i = pointer+1; i < tasks.length; i++){
    tasks[i].startMin = cursor;
    tasks[i].endMin = cursor + tasks[i].baseDurationMin;
    cursor = tasks[i].endMin;
  }
}

function extendCurrentTask(){
  const extra = 5;
  tasks[pointer].baseDurationMin += extra;
  tasks[pointer].redMin += extra;
  tasks[pointer].endMin += extra; // estende só o fim; o início não muda
  cascadeAfterPointer(); // primeiro deixa o atraso empurrar naturalmente as seguintes

  const limit = hardLimitMin();
  const overflow = tasks[tasks.length-1].endMin - limit;
  if(overflow > 0){
    // só comprime o necessário pra nunca ultrapassar o horário limite
    const after = tasks.slice(pointer+1);
    if(after.length){
      const floor = 3;
      let newDur = after.map(t => t.baseDurationMin);
      let toReduce = overflow;
      for(let pass = 0; pass < 4 && toReduce > 0.01; pass++){
        const eligible = newDur.map((d,idx) => idx).filter(idx => newDur[idx] > floor);
        const eligibleTotal = eligible.reduce((s,idx) => s + newDur[idx], 0);
        if(eligibleTotal <= 0) break;
        let reduced = 0;
        eligible.forEach(idx => {
          const share = (newDur[idx] / eligibleTotal) * toReduce;
          const maxRed = newDur[idx] - floor;
          const actual = Math.min(share, maxRed);
          newDur[idx] -= actual;
          reduced += actual;
        });
        toReduce -= reduced;
      }
      after.forEach((t, idx) => { t.baseDurationMin = newDur[idx]; });
    }
    cascadeAfterPointer();
  }
}

// ---------- Marcar tarefa como concluída (comum às duas formas de avançar) ----------
let awaitingStart = false; // true = próxima tarefa aguardando toque em "Iniciar"

function markTaskDone(actualEndMin){
  tasks[pointer].endMin = actualEndMin;
  tasks[pointer].outcome = tasks[pointer].redMin > 0 ? 'late' : 'onTime';
  if(tasks[pointer].outcome === 'onTime') celebrate();
  else encourage();
  pointer++;
  lastSegTaskIndex = -1;
  rebuildTimelineDOM();
}

// Usado pelo diálogo de confirmação (Sim / timeout): a tarefa terminou no
// horário certo, então a próxima começa imediatamente, sem espera.
function advanceTask(actualEndMin){
  if(pointer >= tasks.length) return;
  markTaskDone(actualEndMin);
  recomputeUpcoming();
  const nextTask = pointer < tasks.length ? tasks[pointer] : null;
  playForTask(nextTask);
}

// ---------- Diálogo "a tarefa foi concluída?" ----------
const confirmOverlay = document.getElementById('confirm-overlay');
const confirmCardEl = document.querySelector('.confirm-card');
const confirmTaskName = document.getElementById('confirm-task-name');
const confirmTimerBar = document.getElementById('confirm-timer-bar');
const confirmSecondsEl = document.getElementById('confirm-seconds');
const CONFIRM_MS = 10000;
let confirmState = null; // {deadline}
let lastTickSecond = null;

function openConfirm(){
  confirmState = { deadline: Date.now() + CONFIRM_MS };
  lastTickSecond = null;
  confirmTaskName.textContent = tasks[pointer].name;
  confirmOverlay.style.display = 'flex';
  confirmCardEl.classList.remove('urgent');
  chime();
}
function closeConfirm(){
  confirmOverlay.style.display = 'none';
  confirmCardEl.classList.remove('urgent');
  confirmState = null;
}
function resolveConfirm(answer){
  if(!confirmState) return;
  if(answer === 'nao'){
    try{ extendCurrentTask(); }catch(e){}
    closeConfirm();
    lastSegTaskIndex = -1;
    try{ rebuildTimelineDOM(); }catch(e){}
    startExtraTimeFeedback(); // banner + som + voz, sempre — mesmo se algo acima falhar
  } else {
    const finishAt = tasks[pointer].endMin;
    closeConfirm();
    try{ advanceTask(finishAt); }catch(e){}
  }
  render();
}
document.getElementById('confirm-yes').addEventListener('click', () => resolveConfirm('sim'));
document.getElementById('confirm-no').addEventListener('click', () => resolveConfirm('nao'));

// ---------- Botão "Já terminei" (conclusão antecipada) ----------
function finishEarly(){
  if(pointer >= tasks.length || confirmState || awaitingStart) return;
  const now = new Date();
  const nowMin = now.getHours()*60 + now.getMinutes() + now.getSeconds()/60;
  const finishAt = Math.max(tasks[pointer].startMin, Math.min(nowMin, tasks[pointer].endMin));
  markTaskDone(finishAt);
  if(pointer < tasks.length){
    awaitingStart = true; // próxima tarefa espera o toque em "Iniciar"
  } else {
    recomputeUpcoming();
  }
  render();
}
finishEarlyBtn.addEventListener('click', finishEarly);

// ---------- Botão "Iniciar" (começa a próxima tarefa e antecipa o resto) ----------
const startNextBtn = document.getElementById('start-next-btn');
function startNextTask(){
  if(!awaitingStart) return;
  const now = new Date();
  const nowMin = now.getHours()*60 + now.getMinutes() + now.getSeconds()/60;
  awaitingStart = false;
  recomputeUpcoming(nowMin); // ancora a próxima tarefa (e as seguintes) a partir de agora
  lastSegTaskIndex = -1;
  playForTask(tasks[pointer]);
  render();
}
startNextBtn.addEventListener('click', startNextTask);

// ---------- Reordenar tarefas ainda não feitas ----------
function moveTask(idx, dir){
  const j = idx + dir;
  if(idx < pointer || j < pointer || j >= tasks.length) return;
  const tmp = tasks[idx];
  tasks[idx] = tasks[j];
  tasks[j] = tmp;
  recomputeUpcoming();
  lastSegTaskIndex = -1;
  rebuildTimelineDOM();
  render();
}
timelineEl.addEventListener('click', (e) => {
  const btn = e.target.closest('.reorder-btn');
  if(!btn || btn.disabled) return;
  const idx = parseInt(btn.dataset.index, 10);
  moveTask(idx, btn.classList.contains('up') ? -1 : 1);
});

// ---------- Render principal ----------
function render(){
  const now = new Date();
  clockEl.textContent = String(now.getHours()).padStart(2,'0')+':'+String(now.getMinutes()).padStart(2,'0')+':'+String(now.getSeconds()).padStart(2,'0');
  const nowMin = now.getHours()*60 + now.getMinutes() + now.getSeconds()/60;
  limitHourEl.textContent = String(Math.floor(limitMin/60)).padStart(2,'0');
  limitMinEl.textContent = String(Math.round(limitMin%60)).padStart(2,'0');

  // Marca visualmente tarefas concluídas / ativa
  tasks.forEach((t,i) => {
    const el = document.getElementById('step-'+i);
    if(!el) return;
    el.classList.remove('active','finished');
    if(i < pointer) el.classList.add('finished');
    else if(i === pointer) el.classList.add('active');
  });

  if(pointer >= tasks.length){
    heroEl.classList.add('done');
    heroEmoji.textContent = '🎉';
    heroLabel.textContent = 'Rotina completa!';
    heroSub.textContent = 'Até amanhã!';
    minutesLeftEl.innerHTML = '';
    segmentsEl.innerHTML = '';
    return;
  }

  if(awaitingStart){
    const t = tasks[pointer];
    heroEl.classList.remove('done');
    heroEmoji.textContent = t.emoji;
    heroLabel.textContent = t.name;
    heroSub.textContent = 'Pronto pra começar?';
    minutesLeftEl.innerHTML = '';
    segmentsEl.innerHTML = '';
    finishEarlyBtn.style.display = 'none';
    startNextBtn.style.display = 'inline-block';
    startNextBtn.textContent = '▶ Iniciar "' + t.name + '"';
    return;
  }
  finishEarlyBtn.style.display = 'inline-block';
  startNextBtn.style.display = 'none';

  // Diálogo de confirmação quando o tempo da tarefa atual esgota
  if(!confirmState && nowMin >= tasks[pointer].endMin){
    openConfirm();
  }
  if(confirmState){
    if(Date.now() >= confirmState.deadline){
      resolveConfirm('sim'); // sem resposta em 10s -> assume concluída
      return;
    }
    const msLeft = Math.max(0, confirmState.deadline - Date.now());
    const secLeft = Math.ceil(msLeft/1000);
    confirmSecondsEl.textContent = secLeft;
    confirmTimerBar.style.width = (msLeft/CONFIRM_MS*100) + '%';
    if(secLeft <= 3){
      confirmCardEl.classList.add('urgent');
      if(secLeft !== lastTickSecond){ beep(700, 0.12, 0); lastTickSecond = secLeft; }
    }
  }

  const t = tasks[pointer];
  heroEl.classList.remove('done');
  heroEmoji.textContent = t.emoji;
  heroLabel.textContent = t.name;
  heroSub.textContent = confirmState ? 'Confirmando conclusão...' : `até ${fmtMin(t.endMin)}`;

  const total = t.endMin - t.startMin;
  const elapsed = confirmState ? total : Math.max(0, nowMin - t.startMin);
  const remain = Math.max(0, total - elapsed);
  minutesLeftEl.innerHTML = confirmState ? '' : (Math.ceil(remain) + '<span class="unit">min</span>');

  if(lastSegTaskIndex !== pointer){
    buildSegments(total, t.redMin);
    lastSegTaskIndex = pointer;
  }
  updateSegments(elapsed);
}

// ---------- Botão liga/desliga som ----------
const toggleBtn = document.getElementById('sound-toggle');

function setSoundEnabled(enabled){
  soundEnabled = enabled;
  toggleBtn.textContent = enabled ? '🔊' : '🔇';
  toggleBtn.classList.toggle('off', !enabled);
  if(enabled){
    ensureAudioCtx();
    beep(880,0.15,0); // beep de confirmação ao ligar
  } else {
    stopTaskAudio();
  }
}
function toggleSound(){ setSoundEnabled(!soundEnabled); }
toggleBtn.addEventListener('click', toggleSound);
setSoundEnabled(false); // estado inicial: desligado, ícone 🔇

// ---------- Botões "Testar agora" e "Horário real" ----------
function applyTestSchedule(){
  pointer = 0;
  lastSegTaskIndex = -1;
  closeConfirm();
  awaitingStart = false;
  const now = new Date();
  dayStartMin = Math.ceil(now.getHours()*60 + now.getMinutes() + now.getSeconds()/60) + 1;
  tasks.forEach(t => { t.baseDurationMin = 1; t.redMin = 0; t.outcome = null; }); // 1 minuto por tarefa, pra testar rápido
  recomputeUpcoming();
  catchUpToNow(); // por segurança; normalmente não faz nada aqui, já que começa no futuro
  rebuildTimelineDOM();
  render();
}

function applyPlannedSchedule(){
  initSchedule(TASKS);
  render();
}

document.getElementById('test-schedule-btn').addEventListener('click', applyTestSchedule);
document.getElementById('reset-schedule-btn').addEventListener('click', applyPlannedSchedule);

// ---------- Controle do horário limite (setas de hora e minuto) ----------
const limitHourEl = document.getElementById('limit-hour');
const limitMinEl = document.getElementById('limit-min');
document.getElementById('limit-hour-plus').addEventListener('click', () => { limitMin += 60; render(); });
document.getElementById('limit-hour-minus').addEventListener('click', () => { limitMin = Math.max(0, limitMin - 60); render(); });
document.getElementById('limit-min-plus').addEventListener('click', () => { limitMin += 1; render(); });
document.getElementById('limit-min-minus').addEventListener('click', () => { limitMin = Math.max(0, limitMin - 1); render(); });

// ---------- Tela de configuração (tarefas, horários, ícones e sons) ----------
function hhmmToArr(str){
  const parts = (str || '00:00').split(':').map(Number);
  return [parts[0]||0, parts[1]||0];
}
function arrToHHMM([h,m]){ return String(h).padStart(2,'0')+':'+String(m).padStart(2,'0'); }

let draftTasks = [];
const settingsOverlay = document.getElementById('settings-overlay');
const settingsTasksList = document.getElementById('settings-tasks-list');
const settingsChildNameInput = document.getElementById('settings-child-name');

let timeStepMin = 5;
let autoLinkNext = true;

function openSettings(){
  draftTasks = TASKS.map(t => ({
    name: t.name,
    emoji: t.emoji,
    start: arrToHHMM(t.start),
    end: arrToHHMM(t.end),
    soundType: (t.sound && t.sound.type === 'melody') ? 'melody' : ((t.sound && t.sound.src) ? 'url' : 'chime'),
    soundUrl: (t.sound && t.sound.src) ? t.sound.src : ''
  }));
  settingsChildNameInput.value = CHILD_NAME;
  document.getElementById('autolink-toggle').checked = autoLinkNext;
  document.querySelectorAll('.step-size-btn').forEach(b => {
    b.classList.toggle('selected', parseInt(b.dataset.step,10) === timeStepMin);
  });
  renderSettingsRows();
  settingsOverlay.style.display = 'flex';
}
function closeSettings(){
  settingsOverlay.style.display = 'none';
}

function renderSettingsRows(){
  settingsTasksList.innerHTML = draftTasks.map((t, i) => `
    <div class="task-row" data-index="${i}">
      <div class="emoji-preview">${t.emoji}</div>
      <input type="text" class="settings-text-input task-name-input" data-field="name" data-index="${i}" value="${t.name.replace(/"/g,'&quot;')}" placeholder="Nome da tarefa">
      <div class="task-time-group">
        <div class="time-stepper">
          <button type="button" class="time-step-btn" data-index="${i}" data-field="start" data-dir="1">▲</button>
          <span class="time-value">${t.start}</span>
          <button type="button" class="time-step-btn" data-index="${i}" data-field="start" data-dir="-1">▼</button>
        </div>
        <span>–</span>
        <div class="time-stepper">
          <button type="button" class="time-step-btn" data-index="${i}" data-field="end" data-dir="1">▲</button>
          <span class="time-value">${t.end}</span>
          <button type="button" class="time-step-btn" data-index="${i}" data-field="end" data-dir="-1">▼</button>
        </div>
      </div>
      <select class="settings-select" data-field="soundType" data-index="${i}">
        <option value="chime" ${t.soundType==='chime'?'selected':''}>🔔 Som padrão</option>
        <option value="melody" ${t.soundType==='melody'?'selected':''}>🎶 Melodia animada</option>
        <option value="url" ${t.soundType==='url'?'selected':''}>🔗 Link personalizado</option>
      </select>
      <div class="row-reorder">
        <button class="row-up" data-index="${i}" ${i===0?'disabled':''} title="Mover pra cima">▲</button>
        <button class="row-down" data-index="${i}" ${i===draftTasks.length-1?'disabled':''} title="Mover pra baixo">▼</button>
      </div>
      <button class="remove-task-btn" data-index="${i}" title="Remover tarefa">🗑</button>
      <div class="emoji-picker">
        ${EMOJI_PRESETS.map(e => `<button type="button" data-index="${i}" data-emoji="${e}" class="${t.emoji===e?'selected':''}">${e}</button>`).join('')}
      </div>
      ${t.soundType==='url' ? `<input type="text" class="settings-text-input sound-url-input" data-field="soundUrl" data-index="${i}" value="${(t.soundUrl||'').replace(/"/g,'&quot;')}" placeholder="https://.../musica.mp3 (link direto do arquivo)">` : ''}
    </div>
  `).join('');
}

// Ajusta um horário (start/end) de uma tarefa pelo incremento escolhido.
// Quando mexe no FIM de uma tarefa e o encadeamento automático está ligado,
// empurra o INÍCIO (e o fim, mantendo a duração) da próxima tarefa junto,
// pra nunca sobrar buraco entre uma e outra.
function adjustDraftTime(index, field, dir){
  const t = draftTasks[index];
  let totalMin = toMinutes(hhmmToArr(t[field])) + (dir * timeStepMin);
  totalMin = ((totalMin % 1440) + 1440) % 1440;
  t[field] = arrToHHMM([Math.floor(totalMin/60), totalMin%60]);

  if(field === 'end' && autoLinkNext && index < draftTasks.length - 1){
    const next = draftTasks[index+1];
    const nextDuration = toMinutes(hhmmToArr(next.end)) - toMinutes(hhmmToArr(next.start));
    const newNextStart = totalMin;
    const newNextEnd = newNextStart + nextDuration;
    next.start = arrToHHMM([Math.floor(newNextStart/60)%24, newNextStart%60]);
    next.end = arrToHHMM([Math.floor(newNextEnd/60)%24, newNextEnd%60]);
  }
  renderSettingsRows();
}

document.querySelectorAll('.step-size-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    timeStepMin = parseInt(btn.dataset.step, 10);
    document.querySelectorAll('.step-size-btn').forEach(b => b.classList.toggle('selected', b === btn));
  });
});
document.getElementById('autolink-toggle').addEventListener('change', (e) => {
  autoLinkNext = e.target.checked;
});

settingsTasksList.addEventListener('input', (e) => {
  const field = e.target.dataset.field;
  if(!field) return;
  const idx = parseInt(e.target.dataset.index, 10);
  draftTasks[idx][field] = e.target.value;
});
settingsTasksList.addEventListener('change', (e) => {
  if(e.target.dataset.field === 'soundType'){
    const idx = parseInt(e.target.dataset.index, 10);
    draftTasks[idx].soundType = e.target.value;
    renderSettingsRows(); // pra mostrar/esconder o campo de link
  }
});
settingsTasksList.addEventListener('click', (e) => {
  const timeBtn = e.target.closest('.time-step-btn');
  if(timeBtn){
    adjustDraftTime(parseInt(timeBtn.dataset.index,10), timeBtn.dataset.field, parseInt(timeBtn.dataset.dir,10));
    return;
  }
  const emojiBtn = e.target.closest('.emoji-picker button');
  if(emojiBtn){
    draftTasks[parseInt(emojiBtn.dataset.index,10)].emoji = emojiBtn.dataset.emoji;
    renderSettingsRows();
    return;
  }
  const removeBtn = e.target.closest('.remove-task-btn');
  if(removeBtn){
    draftTasks.splice(parseInt(removeBtn.dataset.index,10), 1);
    renderSettingsRows();
    return;
  }
  const upBtn = e.target.closest('.row-up');
  if(upBtn && !upBtn.disabled){
    const i = parseInt(upBtn.dataset.index,10);
    [draftTasks[i-1], draftTasks[i]] = [draftTasks[i], draftTasks[i-1]];
    renderSettingsRows();
    return;
  }
  const downBtn = e.target.closest('.row-down');
  if(downBtn && !downBtn.disabled){
    const i = parseInt(downBtn.dataset.index,10);
    [draftTasks[i+1], draftTasks[i]] = [draftTasks[i], draftTasks[i+1]];
    renderSettingsRows();
    return;
  }
});

document.getElementById('settings-add-task').addEventListener('click', () => {
  const last = draftTasks[draftTasks.length-1];
  const lastEndMin = last ? toMinutes(hhmmToArr(last.end)) : (8*60);
  draftTasks.push({
    name: 'Nova tarefa',
    emoji: '⭐',
    start: arrToHHMM([Math.floor(lastEndMin/60), lastEndMin%60]),
    end: arrToHHMM([Math.floor((lastEndMin+10)/60), (lastEndMin+10)%60]),
    soundType: 'chime',
    soundUrl: ''
  });
  renderSettingsRows();
});

document.getElementById('settings-save').addEventListener('click', () => {
  if(draftTasks.length === 0){
    alert('Adicione pelo menos uma tarefa antes de salvar.');
    return;
  }
  for(const t of draftTasks){
    if(!t.name || !t.name.trim()){
      alert('Toda tarefa precisa de um nome.');
      return;
    }
    const s = toMinutes(hhmmToArr(t.start));
    const e = toMinutes(hhmmToArr(t.end));
    if(e <= s){
      alert(`A tarefa "${t.name}" precisa ter o horário de fim depois do início.`);
      return;
    }
  }
  const newConfig = draftTasks.map(t => {
    let sound;
    if(t.soundType === 'melody') sound = { type: 'melody' };
    else if(t.soundType === 'url' && t.soundUrl && t.soundUrl.trim()) sound = { type: 'url', src: t.soundUrl.trim(), loop: false };
    return {
      name: t.name.trim(),
      emoji: t.emoji,
      start: hhmmToArr(t.start),
      end: hhmmToArr(t.end),
      sound
    };
  });
  const newName = settingsChildNameInput.value.trim();
  saveStoredConfig(newName, newConfig);
  TASKS = newConfig;
  CHILD_NAME = newName;
  initSchedule(TASKS);
  closeSettings();
});
document.getElementById('settings-cancel').addEventListener('click', closeSettings);
document.getElementById('config-btn').addEventListener('click', openSettings);

// Agora que tudo (DOM, funções, tela de configuração) já existe, monta a
// rotina de verdade a partir da configuração salva neste navegador (ou do
// padrão, se for a primeira vez).
initSchedule(TASKS);

function safeRender(){
  try{ render(); }catch(e){ /* nunca deixa o loop travar por causa de um erro pontual */ }
}
safeRender();
setInterval(safeRender, 1000);
</script>
